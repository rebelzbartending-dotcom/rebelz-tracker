<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Rebelz — Live Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080806;--bg2:#13110a;--bg3:#0c0b07;--gold:#C9A84C;--gold-hi:#E8D089;--gold-lo:#9a7d2e;--line:#2a2415;--ink:#f5f0e4;--muted:#8a8268}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a08;min-height:100vh;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh}

/* HERO */
.hero{background:linear-gradient(170deg,#15130c 0%,#0c0b07 50%,#080806 100%);padding:32px 20px 28px;text-align:center;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,#C9A84C18,transparent 70%);border-radius:50%;pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-40px;right:-30px;width:160px;height:160px;background:radial-gradient(circle,#C9A84C0e,transparent 70%);border-radius:50%;pointer-events:none}
.hero-logo{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 22px #C9A84C55;background:#000;margin:0 auto 14px;display:block;position:relative;z-index:1}
.hero-type{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;position:relative;z-index:1}
.hero-name{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:0.04em;margin-bottom:5px;position:relative;z-index:1;line-height:1.2}
.hero-date{font-size:12px;color:var(--muted);margin-bottom:3px;position:relative;z-index:1}
.hero-guests{font-size:12px;color:var(--muted);margin-bottom:14px;position:relative;z-index:1}
.hero-guests span{color:var(--gold);font-weight:700}
.hero-div{width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 14px;position:relative;z-index:1}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:#0f1a0e;border:1px solid #2e6b4866;border-radius:18px;padding:5px 14px;font-size:11px;color:#5fd99a;position:relative;z-index:1}
.pulse{width:7px;height:7px;background:#5fd99a;border-radius:50%;animation:pulse 1.5s infinite;flex-shrink:0}
.closed-badge{display:inline-flex;align-items:center;gap:6px;background:#1a0f0f;border:1px solid #6b2e2e66;border-radius:18px;padding:5px 14px;font-size:11px;color:#e88080;position:relative;z-index:1}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}}

/* BODY */
.body{padding:18px 16px}
.sec-title{font-size:11px;color:var(--gold);letter-spacing:0.1em;text-transform:uppercase;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* CONSUMPTION ITEMS */
.cons-item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.cons-item::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#C9A84C44,transparent)}
.ci-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ci-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink)}
.ci-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ci-right{text-align:right}
.ci-num{font-size:22px;font-weight:700;color:var(--gold);line-height:1}
.ci-lbl{font-size:9px;color:var(--muted)}
.bottles{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;min-height:30px}
.bb{width:20px;height:26px;border-radius:4px;border:1px solid}
.bb.full{background:var(--gold);border-color:var(--gold-hi)}
.bb.used{background:#2a2415;border-color:#3a3420}
.ci-prog{height:4px;background:#2a2415;border-radius:2px;overflow:hidden;margin-bottom:6px}
.ci-prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-hi))}
.ci-stats{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.ci-stats span b{color:var(--ink)}

/* CLOSING SUMMARY */
.closing-note{font-size:11px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px;line-height:1.6}
.closing-note .cn-item{margin-bottom:4px}
.closing-note .cn-item:last-child{margin-bottom:0}

/* TEAM */
.team-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.team-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#C9A84C44,transparent)}
.team-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.team-row:last-child{border:none;padding-bottom:0}
.team-row .tk{color:var(--muted)}
.team-row .tv{color:var(--ink);font-weight:600}
.team-row .tv.gold{color:var(--gold)}

/* WHATSAPP */
.wa-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:linear-gradient(135deg,#25d366,#128c4e);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:16px;letter-spacing:0.03em;box-shadow:0 4px 16px #25d36633}

/* FEEDBACK */
.fb-card{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.fb-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#C9A84C66,transparent)}
.fb-locked{text-align:center;padding:16px 0}
.fb-locked .lock-icon{font-size:28px;display:block;margin-bottom:7px}
.fb-locked p{font-size:12px;color:var(--muted)}
.fb-title{font-size:13px;color:var(--gold);font-weight:700;text-align:center;margin-bottom:4px}
.fb-sub{font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px}
.stars{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.star{font-size:30px;color:#2a2415;cursor:pointer;transition:color 0.15s;-webkit-user-select:none;user-select:none}
.star.on{color:var(--gold)}
.reactions{display:grid;gap:8px;margin-bottom:12px}
.reaction{padding:10px 14px;border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--muted);cursor:pointer;text-align:center;background:var(--bg3)}
.reaction.sel,.reaction:hover{border-color:var(--gold);color:var(--gold);background:#C9A84C0e}
.fb-textarea{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--ink);font-family:inherit;resize:none;height:72px;margin-bottom:10px}
.fb-textarea::placeholder{color:#5a5440}
.fb-textarea:focus{outline:none;border-color:var(--gold)}
.fb-btn{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:#0c0b07;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;box-shadow:0 4px 14px #C9A84C33}

/* THANK YOU */
.ty{display:none;text-align:center;padding:28px 10px}
.ty .ty-icon{font-size:44px;display:block;margin-bottom:12px}
.ty h3{font-size:18px;color:var(--ink);font-weight:700;margin-bottom:8px}
.ty p{font-size:12px;color:var(--muted);line-height:1.7}
.ty .ty-tag{color:var(--gold);font-style:italic;display:block;margin-top:10px;font-size:11px;letter-spacing:0.06em}

/* FOOTER */
.foot{text-align:center;padding:16px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,#C9A84C08)}
.foot-logo{width:42px;height:42px;border-radius:50%;border:1.5px solid #C9A84C44;margin-bottom:6px;background:#000;object-fit:cover}
.foot-name{font-size:11px;color:var(--gold);letter-spacing:0.1em;font-weight:700}
.foot-tag{font-size:9px;color:#6a6450;margin-top:3px}

.loading{text-align:center;padding:60px 20px;color:var(--gold);font-size:13px}
.error-page{text-align:center;padding:60px 20px;color:#ff9999;font-size:13px}

/* category dot colors */
.dot-whiskey{background:#a78bfa}.dot-vodka{background:#67e8f9}.dot-gin{background:#86efac}
.dot-rum{background:#fb923c}.dot-tequila{background:#fbbf24}.dot-brandy{background:#f87171}
.dot-beer{background:#fcd34d}.dot-wine{background:#e879f9}.dot-others{background:#94a3b8}
.dot-na{background:#4ade80}
</style>
</head>
<body>
<div class="wrap">
  <div id="loadingPage" class="loading">Loading event...</div>
  <div id="mainPage" style="display:none"></div>
  <div id="errorPage" class="error-page" style="display:none"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDcrx5tOL1Y2TWiz1VFfCAC_OagARggGNE",
  authDomain: "rebelz-tracker.firebaseapp.com",
  databaseURL: "https://rebelz-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rebelz-tracker",
  storageBucket: "rebelz-tracker.firebasestorage.app",
  messagingSenderId: "234156658582",
  appId: "1:234156658582:web:26597fc333698b0778d7b7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const BASE = "https://tracker.rebelzbartending.com";

const params = new URLSearchParams(location.search);
const eventId = params.get('ev');

if (!eventId) {
  document.getElementById('loadingPage').style.display = 'none';
  document.getElementById('errorPage').style.display = 'block';
  document.getElementById('errorPage').textContent = 'Invalid link. No event ID found.';
} else {
  onValue(ref(db, `events/${eventId}`), snap => {
    document.getElementById('loadingPage').style.display = 'none';
    if (!snap.exists()) {
      document.getElementById('errorPage').style.display = 'block';
      document.getElementById('errorPage').textContent = 'Event not found.';
      return;
    }
    const ev = snap.val();
    document.title = `${ev.clientName} — Rebelz Tracker`;
    renderPage(ev);
  });
}

function dotClass(cat) {
  const c = (cat||'').toLowerCase();
  if (c.includes('whiskey')||c.includes('whisky')) return 'dot-whiskey';
  if (c.includes('vodka')) return 'dot-vodka';
  if (c.includes('gin')) return 'dot-gin';
  if (c.includes('rum')) return 'dot-rum';
  if (c.includes('tequila')) return 'dot-tequila';
  if (c.includes('brandy')) return 'dot-brandy';
  if (c.includes('beer')) return 'dot-beer';
  if (c.includes('wine')) return 'dot-wine';
  return 'dot-others';
}

function buildBottles(given, remaining) {
  const max = Math.min(given, 30); // cap at 30 for display
  let html = '';
  for (let i = 0; i < max; i++) {
    html += `<div class="bb ${i < remaining ? 'full' : 'used'}"></div>`;
  }
  if (given > 30) html += `<span style="font-size:9px;color:var(--muted);align-self:center;margin-left:4px">+${given-30} more</span>`;
  return html;
}

function buildConsItem(d, isNA) {
  const given = d.opening || 0;
  const consumed = d.consumed || 0;
  const remaining = Math.max(0, given - consumed);
  const pct = given > 0 ? Math.round((remaining / given) * 100) : 0;
  const dotCls = isNA ? 'dot-na' : dotClass(d.category);
  return `
    <div class="cons-item">
      <div class="ci-top">
        <div class="ci-name">
          <div class="ci-dot ${dotCls}"></div>
          ${d.name}
        </div>
        <div class="ci-right">
          <div class="ci-num">${remaining}</div>
          <div class="ci-lbl">remaining</div>
        </div>
      </div>
      <div class="bottles">${buildBottles(given, remaining)}</div>
      <div class="ci-prog"><div class="ci-prog-fill" style="width:${pct}%"></div></div>
      <div class="ci-stats">
        <span>Given: <b>${given}</b></span>
        <span>Used: <b>${consumed}</b></span>
        <span>Left: <b>${remaining} (${pct}%)</b></span>
      </div>
    </div>`;
}

function buildClosingSummary(ev) {
  const closing = ev.closing || {};
  const alcDrinks = ev.drinks ? Object.values(ev.drinks) : [];
  const naDrinks = ev.nonAlcDrinks ? Object.values(ev.nonAlcDrinks) : [];
  let html = '<div class="closing-note"><div style="font-size:11px;color:var(--gold);font-weight:700;margin-bottom:8px">Final Closing Summary</div>';
  alcDrinks.forEach((d, i) => {
    const cl = closing[`alc_${i}`] || {};
    const isBeer = d.category === 'Beer';
    const leftStr = isBeer
      ? `${cl.sealed || 0} sealed`
      : `${cl.sealed || 0} sealed + ${cl.running || 0} running (${cl.ml || 0}ml)`;
    html += `<div class="cn-item"><b style="color:var(--ink)">${d.name}</b> — Given: ${d.opening} | Used: ${d.consumed||0} | Left: ${leftStr}</div>`;
  });
  naDrinks.forEach((d, i) => {
    const cl = closing[`na_${i}`] || {};
    html += `<div class="cn-item"><b style="color:var(--ink)">${d.name}</b> — Given: ${d.opening} | Used: ${d.consumed||0} | Left: ${cl.remaining || 0}</div>`;
  });
  html += '</div>';
  return html;
}

function renderPage(ev) {
  const isLive = ev.status === 'live';
  const isDone = ev.status === 'done';
  const badge = isLive
    ? `<div class="live-badge"><span class="pulse"></span> Bar is Open</div>`
    : isDone
    ? `<div class="closed-badge">✓ Event Closed</div>`
    : `<div class="closed-badge">◌ Setting Up</div>`;

  const alcDrinks = ev.drinks ? Object.values(ev.drinks) : [];
  const naDrinks = ev.nonAlcDrinks ? Object.values(ev.nonAlcDrinks) : [];

  let consHtml = '';
  if (alcDrinks.length || naDrinks.length) {
    consHtml = `<div class="sec-title">📊 ${isLive ? 'Live' : 'Final'} Consumption</div>`;
    if (isDone) consHtml += buildClosingSummary(ev);
    alcDrinks.forEach(d => consHtml += buildConsItem(d, false));
    naDrinks.forEach(d => consHtml += buildConsItem(d, true));
  } else {
    consHtml = `<div class="sec-title">📊 Consumption</div><div style="font-size:12px;color:var(--muted);padding:10px 0">Bar setup in progress...</div>`;
  }

  const teamHtml = (ev.teamLeader || ev.numBartenders) ? `
    <div class="team-card">
      <div class="sec-title">👥 Your Bar Team Tonight</div>
      ${ev.teamLeader ? `<div class="team-row"><span class="tk">Team Leader</span><span class="tv gold">${ev.teamLeader}</span></div>` : ''}
      ${ev.numBartenders ? `<div class="team-row"><span class="tk">Bartenders on duty</span><span class="tv">${ev.numBartenders}</span></div>` : ''}
      ${ev.bartenderNames ? `<div class="team-row"><span class="tk">Team members</span><span class="tv">${ev.bartenderNames}</span></div>` : ''}
    </div>` : '';

  const clientNum = (ev.clientWhatsApp || '').replace('+91','').replace(/\s/g,'');
  const clientLink = `${BASE}/customer.html?ev=${eventId}`;
  const waMsg = encodeURIComponent(`🍸 Hi, I'd like an update on the bar status for ${ev.clientName}'s ${ev.eventType}. Event: ${eventId}\n🔗 ${clientLink}`);
  const bartNum = (ev.bartenderWhatsApp || '').replace('+91','').replace(/\s/g,'');
  const waUrl = `https://wa.me/91${bartNum}?text=${waMsg}`;

  // Feedback section
  const fbSection = isDone ? `
    <div class="fb-card">
      <div id="fbContent">
        <div class="fb-title">How Was Your Experience?</div>
        <div class="fb-sub">Your feedback helps us serve better</div>
        <div class="stars" id="stars">
          <span class="star" onclick="rateStar(1)">★</span>
          <span class="star" onclick="rateStar(2)">★</span>
          <span class="star" onclick="rateStar(3)">★</span>
          <span class="star" onclick="rateStar(4)">★</span>
          <span class="star" onclick="rateStar(5)">★</span>
        </div>
        <div class="reactions">
          <div class="reaction" onclick="selReaction(this)">🍸 Bar service was excellent</div>
          <div class="reaction" onclick="selReaction(this)">⚡ Quick and efficient team</div>
          <div class="reaction" onclick="selReaction(this)">👏 Very professional bartenders</div>
        </div>
        <textarea class="fb-textarea" id="fbText" placeholder="Tell us more about your experience (optional)..."></textarea>
        <button class="fb-btn" onclick="submitFeedback()">Submit Feedback ✦</button>
      </div>
      <div class="ty" id="tyScreen">
        <span class="ty-icon">🏆</span>
        <h3>Thank You!</h3>
        <p>It was a pleasure serving you.<br>We hope your celebration was unforgettable.</p>
        <span class="ty-tag">✦ Think of a Party, Think of Us ✦</span>
      </div>
    </div>` : `
    <div class="fb-card">
      <div class="fb-locked">
        <span class="lock-icon">🔒</span>
        <p>Feedback form unlocks after the event closes</p>
      </div>
    </div>`;

  const html = `
    <div class="hero">
      <img class="hero-logo" src="./rebelz bartending logo.png" onerror="this.style.background='#C9A84C'" alt="Rebelz">
      <div class="hero-type">${ev.eventType || ''} · ${ev.city || ''}</div>
      <div class="hero-name">${ev.clientName || ''}</div>
      <div class="hero-date">${ev.date || ''}</div>
      <div class="hero-guests">Guests: <span>${ev.guests || '—'}</span></div>
      <div class="hero-div"></div>
      ${badge}
    </div>
    <div class="body">
      ${consHtml}
      ${teamHtml}
      <button class="wa-btn" onclick="window.open('${waUrl}','_blank')">📲 Get Update on WhatsApp</button>
      ${fbSection}
    </div>
    <div class="foot">
      <img class="foot-logo" src="./rebelz bartending logo.png" onerror="this.style.background='#C9A84C'" alt="Rebelz">
      <div class="foot-name">REBELZ BARTENDING</div>
      <div class="foot-tag">rebelzbartending.com · Think of a Party, Think of Us</div>
    </div>`;

  document.getElementById('mainPage').innerHTML = html;
  document.getElementById('mainPage').style.display = 'block';

  // Check if feedback already submitted
  if (isDone && ev.feedback) {
    const fc = document.getElementById('fbContent');
    const ty = document.getElementById('tyScreen');
    if (fc) fc.style.display = 'none';
    if (ty) ty.style.display = 'block';
  }
}

// ── FEEDBACK ──
let selectedRating = 0;
let selectedReaction = '';

window.rateStar = (n) => {
  selectedRating = n;
  document.querySelectorAll('.star').forEach((s,i) => s.classList.toggle('on', i < n));
};

window.selReaction = (el) => {
  selectedReaction = el.textContent;
  document.querySelectorAll('.reaction').forEach(r => r.classList.remove('sel'));
  el.classList.add('sel');
};

window.submitFeedback = async () => {
  if (!selectedRating) { alert('Please select a star rating'); return; }
  const comment = document.getElementById('fbText')?.value.trim() || '';
  await update(ref(db, `events/${eventId}/feedback`), {
    rating: selectedRating,
    reaction: selectedReaction,
    comment,
    submittedAt: Date.now()
  });
  const fc = document.getElementById('fbContent');
  const ty = document.getElementById('tyScreen');
  if (fc) fc.style.display = 'none';
  if (ty) ty.style.display = 'block';
};
</script>
</body>
</html>
