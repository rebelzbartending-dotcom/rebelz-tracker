<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Rebelz — Live Tracker</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080806;--bg2:#13110a;--bg3:#0c0b07;--gold:#C9A84C;--gold-hi:#E8D089;--gold-lo:#9a7d2e;--line:#2a2415;--ink:#f5f0e4;--muted:#8a8268}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a08;min-height:100vh;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh}
.hero{background:linear-gradient(170deg,#15130c 0%,#0c0b07 50%,#080806 100%);padding:32px 20px 28px;text-align:center;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,#C9A84C18,transparent 70%);border-radius:50%;pointer-events:none}
.hero-logo{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 22px #C9A84C55;background:#C9A84C;margin:0 auto 14px;display:block;position:relative;z-index:1}
.hero-type{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;position:relative;z-index:1}
.hero-name{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:0.04em;margin-bottom:5px;position:relative;z-index:1;line-height:1.2}
.hero-date{font-size:12px;color:var(--muted);margin-bottom:12px;position:relative;z-index:1}
.hero-div{width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 14px;position:relative;z-index:1}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:#0f1a0e;border:1px solid #2e6b4866;border-radius:18px;padding:5px 14px;font-size:11px;color:#5fd99a;position:relative;z-index:1}
.pulse{width:7px;height:7px;background:#5fd99a;border-radius:50%;animation:pulse 1.5s infinite;flex-shrink:0}
.closed-badge{display:inline-flex;align-items:center;gap:6px;background:#1a0f0f;border:1px solid #6b2e2e66;border-radius:18px;padding:5px 14px;font-size:11px;color:#e88080;position:relative;z-index:1}
.setup-badge{display:inline-flex;align-items:center;gap:6px;background:#1a1a35;border:1px solid #4338ca44;border-radius:18px;padding:5px 14px;font-size:11px;color:#a5b4fc;position:relative;z-index:1}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}}
.body{padding:16px}
.sec-title{font-size:10px;color:var(--gold);letter-spacing:0.1em;text-transform:uppercase;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* SUMMARY STATS */
.sum-stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.ss{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.ss .sn{font-size:20px;font-weight:700;line-height:1}
.ss .sl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:3px}

/* DRINK CARDS (current system style) */
.d-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.d-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#C9A84C44,transparent)}
.dc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.dc-left{display:flex;flex-direction:column;gap:2px}
.dc-name-row{display:flex;align-items:center;gap:8px}
.dc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dc-name{font-size:14px;font-weight:700;color:var(--ink)}
.dc-cat{font-size:10px;padding:2px 8px;border-radius:8px}
.dc-cat.alc{color:var(--gold);background:#C9A84C18}
.dc-cat.na{color:#5fd99a;background:#0f1a0e}
.dc-sub{font-size:11px;color:var(--muted);margin-left:18px}
.dc-num{font-size:30px;font-weight:700;color:var(--gold);line-height:1;text-align:right}
.dc-num.zero{color:var(--muted)}
.bottles{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px;min-height:28px}
.bb{width:18px;height:24px;border-radius:3px;border:1px solid}
.bb.full{background:var(--gold);border-color:var(--gold-hi)}
.bb.used{background:#2a2415;border-color:#3a3420}
.d-prog{height:4px;background:#2a2415;border-radius:2px;overflow:hidden;margin-bottom:6px}
.d-prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-hi))}
.d-stats{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.d-stats span b{color:var(--ink)}

/* CLOSING SUMMARY */
.close-summary{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.cs-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.cs-row:last-child{border:none;padding-bottom:0}
.cs-name{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}
.cs-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cs-detail{font-size:11px;color:var(--muted);text-align:right}

/* TEAM */
.team-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.team-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#C9A84C44,transparent)}
.tr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.tr:last-child{border:none;padding-bottom:0}
.tr .tk{color:var(--muted)}
.tr .tv{color:var(--ink);font-weight:600}
.tr .tv.g{color:var(--gold)}

/* FEEDBACK */
.fb-card{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.fb-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#C9A84C66,transparent)}
.fb-locked{text-align:center;padding:16px 0}
.fb-locked .lock{font-size:28px;display:block;margin-bottom:7px}
.fb-locked p{font-size:12px;color:var(--muted)}
.fb-title{font-size:13px;color:var(--gold);font-weight:700;text-align:center;margin-bottom:4px}
.fb-sub{font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px}
.stars{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.star{font-size:30px;color:#2a2415;cursor:pointer;-webkit-user-select:none;user-select:none}
.star.on{color:var(--gold)}
.reactions{display:grid;gap:8px;margin-bottom:12px}
.reaction{padding:11px;border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--muted);cursor:pointer;text-align:center;background:var(--bg3)}
.reaction.sel{border-color:var(--gold);color:var(--gold);background:#C9A84C0e}
.fb-textarea{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px;color:var(--ink);font-family:inherit;resize:none;height:72px;margin-bottom:10px}
.fb-textarea:focus{outline:none;border-color:var(--gold)}
.fb-textarea::placeholder{color:#5a5440}
.fb-btn{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:#0c0b07;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;box-shadow:0 4px 14px #C9A84C33}
.ty{display:none;text-align:center;padding:24px 10px}
.ty .ty-icon{font-size:44px;display:block;margin-bottom:10px}
.ty h3{font-size:18px;color:var(--ink);font-weight:700;margin-bottom:8px}
.ty p{font-size:12px;color:var(--muted);line-height:1.7}
.ty .ty-tag{color:var(--gold);font-style:italic;display:block;margin-top:10px;font-size:11px;letter-spacing:0.06em}

.foot{text-align:center;padding:16px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,#C9A84C08)}
.foot-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1.5px solid #C9A84C44;margin-bottom:6px;background:#C9A84C}
.foot-name{font-size:11px;color:var(--gold);letter-spacing:0.1em;font-weight:700}
.foot-tag{font-size:9px;color:#6a6450;margin-top:3px}
.loading{text-align:center;padding:60px 20px;color:var(--gold);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div id="mainContent"><div class="loading">Loading event...</div></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDcrx5tOL1Y2TWiz1VFfCAC_OagARggGNE",
  authDomain:"rebelz-tracker.firebaseapp.com",
  databaseURL:"https://rebelz-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"rebelz-tracker",
  storageBucket:"rebelz-tracker.firebasestorage.app",
  messagingSenderId:"234156658582",
  appId:"1:234156658582:web:26597fc333698b0778d7b7"
});
var db=firebase.database();
var params=new URLSearchParams(location.search);
var eventId=params.get('ev');
var fbRating=0,fbReaction='';

var catColors={whiskey:'#a78bfa',vodka:'#67e8f9',gin:'#86efac',rum:'#fb923c',tequila:'#fbbf24',brandy:'#f87171',beer:'#fcd34d',wine:'#e879f9',others:'#94a3b8',na:'#4ade80'};
function dotColor(cat){var c=(cat||'').toLowerCase();for(var k in catColors){if(c.includes(k))return catColors[k];}return catColors.others;}

if(!eventId){
  document.getElementById('mainContent').innerHTML='<div style="padding:40px;text-align:center;color:#ff9999">Invalid link.</div>';
} else {
  db.ref('events/'+eventId).on('value',function(snap){
    if(!snap.exists()){document.getElementById('mainContent').innerHTML='<div style="padding:40px;text-align:center;color:#ff9999">Event not found.</div>';return;}
    render(snap.val());
  });
}

function buildBottles(given,remaining){
  var max=Math.min(given,24);
  var html='';
  for(var i=0;i<max;i++)html+='<div class="bb '+(i<remaining?'full':'used')+'"></div>';
  if(given>24)html+='<span style="font-size:9px;color:var(--muted);align-self:center;margin-left:4px">+more</span>';
  return html;
}

function render(ev){
  document.title=(ev.clientName||'Event')+' — Rebelz Tracker';
  var isLive=ev.status==='live',isDone=ev.status==='done';
  var badge=isLive?'<div class="live-badge"><span class="pulse"></span> Bar is Open</div>'
    :isDone?'<div class="closed-badge">✓ Event Closed</div>'
    :'<div class="setup-badge">◌ Setting Up</div>';
  var alc=ev.drinks?Object.values(ev.drinks):[];
  var na=ev.nonAlcDrinks?Object.values(ev.nonAlcDrinks):[];
  var all=alc.concat(na);

  // Summary stats
  var given=all.reduce(function(s,d){return s+(d.opening||0);},0);
  var used=all.reduce(function(s,d){return s+(d.consumed||0);},0);
  var left=given-used;
  var empty=all.filter(function(d){return(d.consumed||0)>=(d.opening||0)&&d.opening>0;}).length;

  var sumHtml='<div class="sum-stats">'+
    '<div class="ss"><div class="sn" style="color:var(--gold)">'+given+'</div><div class="sl">Given</div></div>'+
    '<div class="ss"><div class="sn" style="color:#e88080">'+used+'</div><div class="sl">Used</div></div>'+
    '<div class="ss"><div class="sn" style="color:#5fd99a">'+left+'</div><div class="sl">Left</div></div>'+
    '<div class="ss"><div class="sn" style="color:var(--muted)">'+empty+'</div><div class="sl">Empty</div></div>'+
    '</div>';

  // Drink cards
  var cardsHtml='';
  if(all.length){
    cardsHtml='<div class="sec-title">📊 '+(isLive?'Live':'Final')+' Consumption</div>'+sumHtml;
    all.forEach(function(d,i){
      var isNA=i>=alc.length;
      var given=d.opening||0,used=d.consumed||0,rem=Math.max(0,given-used);
      var pct=given>0?Math.round(rem/given*100):0;
      cardsHtml+='<div class="d-card">'+
        '<div class="dc-top">'+
          '<div class="dc-left">'+
            '<div class="dc-name-row"><div class="dc-dot" style="background:'+dotColor(isNA?'na':d.category)+'"></div>'+
            '<span class="dc-name">'+d.name+'</span>'+
            '<span class="dc-cat '+(isNA?'na':'alc')+'">'+d.category+'</span></div>'+
            '<div class="dc-sub">used: '+used+' · left: '+rem+' of '+given+'</div>'+
          '</div>'+
          '<div class="dc-num'+(rem===0?' zero':'')+'>'+rem+'</div>'+
        '</div>'+
        '<div class="bottles">'+buildBottles(given,rem)+'</div>'+
        '<div class="d-prog"><div class="d-prog-fill" style="width:'+pct+'%"></div></div>'+
        '<div class="d-stats"><span>Given: <b>'+given+'</b></span><span>Used: <b>'+used+'</b></span><span>Left: <b>'+rem+' ('+pct+'%)</b></span></div>'+
        '</div>';
    });
  } else {
    cardsHtml='<div class="sec-title">📊 Consumption</div><div style="font-size:12px;color:var(--muted);padding:10px 0;margin-bottom:14px">Bar setup in progress...</div>';
  }

  // Closing summary
  if(isDone&&ev.closing){
    cardsHtml+='<div class="sec-title" style="margin-top:4px">📋 Closing Summary</div>';
    var cl=ev.closing;
    cardsHtml+='<div class="close-summary">';
    alc.forEach(function(d,i){
      var c=cl['alc_'+i]||{};
      var isBeer=d.category==='Beer';
      var leftStr=isBeer?(c.sealed||0)+' sealed':(c.sealed||0)+' sealed'+(c.running?', '+(c.running||0)+' running ('+(c.ml||0)+'ml)':'');
      cardsHtml+='<div class="cs-row"><div class="cs-name"><div class="cs-dot" style="background:'+dotColor(d.category)+'"></div>'+d.name+'</div><div class="cs-detail">'+leftStr+'</div></div>';
    });
    na.forEach(function(d,i){
      var c=cl['na_'+i]||{};
      cardsHtml+='<div class="cs-row"><div class="cs-name"><div class="cs-dot" style="background:#4ade80"></div>'+d.name+'</div><div class="cs-detail">'+(c.remaining||0)+' units left</div></div>';
    });
    cardsHtml+='</div>';
  }

  // Team
  var teamHtml='';
  if(ev.teamLeader){
    teamHtml='<div class="team-card">'+
      '<div class="sec-title">👥 Your Bar Team Tonight</div>'+
      '<div class="tr"><span class="tk">Team Leader</span><span class="tv g">'+ev.teamLeader+'</span></div>'+
      (ev.numBartenders?'<div class="tr"><span class="tk">Bartenders on duty</span><span class="tv">'+ev.numBartenders+'</span></div>':'')+
      (ev.bartenderNames?'<div class="tr"><span class="tk">Team members</span><span class="tv">'+ev.bartenderNames+'</span></div>':'')+
      '</div>';
  }

  // Feedback
  var fbHtml='<div class="fb-card">';
  if(!isDone){
    fbHtml+='<div class="fb-locked"><span class="lock">🔒</span><p>Feedback form unlocks after the event closes</p></div>';
  } else if(ev.feedback){
    fbHtml+='<div class="ty" style="display:block"><span class="ty-icon">🏆</span><h3>Thank You!</h3><p>It was a pleasure serving you.<br>We hope your celebration was unforgettable.</p><span class="ty-tag">✦ Think of a Party, Think of Us ✦</span></div>';
  } else {
    fbHtml+='<div id="fbForm">'+
      '<div class="fb-title">How Was Your Experience?</div>'+
      '<div class="fb-sub">Your feedback helps us serve better</div>'+
      '<div class="stars" id="stars"><span class="star" onclick="rate(1)">★</span><span class="star" onclick="rate(2)">★</span><span class="star" onclick="rate(3)">★</span><span class="star" onclick="rate(4)">★</span><span class="star" onclick="rate(5)">★</span></div>'+
      '<div class="reactions"><div class="reaction" onclick="react(this)">🍸 Bar service was excellent</div><div class="reaction" onclick="react(this)">⚡ Quick and efficient team</div><div class="reaction" onclick="react(this)">👏 Very professional bartenders</div></div>'+
      '<textarea class="fb-textarea" id="fbText" placeholder="Tell us more (optional)..."></textarea>'+
      '<button class="fb-btn" onclick="submitFb()">Submit Feedback ✦</button>'+
      '</div>'+
      '<div class="ty" id="tyScreen"><span class="ty-icon">🏆</span><h3>Thank You!</h3><p>It was a pleasure serving you.<br>We hope your celebration was unforgettable.</p><span class="ty-tag">✦ Think of a Party, Think of Us ✦</span></div>';
  }
  fbHtml+='</div>';

  document.getElementById('mainContent').innerHTML=
    '<div class="hero">'+
      '<img class="hero-logo" src="./rebelz bartending logo.png" onerror="this.style.background=\'#C9A84C\'" alt="Rebelz">'+
      '<div class="hero-type">'+(ev.eventType||'')+' · '+(ev.city||'')+'</div>'+
      '<div class="hero-name">'+(ev.clientName||'')+'</div>'+
      '<div class="hero-date">'+(ev.date||'')+(ev.guests?' · '+ev.guests+' guests':'')+'</div>'+
      '<div class="hero-div"></div>'+badge+
    '</div>'+
    '<div class="body">'+cardsHtml+teamHtml+fbHtml+'</div>'+
    '<div class="foot">'+
      '<img class="foot-logo" src="./rebelz bartending logo.png" onerror="this.style.background=\'#C9A84C\'" alt="Rebelz">'+
      '<div class="foot-name">REBELZ BARTENDING</div>'+
      '<div class="foot-tag">rebelzbartending.com · Think of a Party, Think of Us</div>'+
    '</div>';
}

function rate(n){fbRating=n;document.querySelectorAll('.star').forEach(function(s,i){s.classList.toggle('on',i<n);});}
function react(el){fbReaction=el.textContent;document.querySelectorAll('.reaction').forEach(function(r){r.classList.remove('sel');});el.classList.add('sel');}
function submitFb(){
  if(!fbRating){alert('Please select a star rating');return;}
  var comment=(document.getElementById('fbText')||{}).value||'';
  db.ref('events/'+eventId+'/feedback').set({rating:fbRating,reaction:fbReaction,comment:comment,submittedAt:Date.now()});
  var f=document.getElementById('fbForm');var t=document.getElementById('tyScreen');
  if(f)f.style.display='none';if(t)t.style.display='block';
}
</script>
</body>
</html>
